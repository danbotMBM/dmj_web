# For this server to take effect run the following commands
# sudo cp nginx.conf /etc/nginx/conf.d/dmj_web.conf
# sudo nginx -t
# sudo nginx -s reload

# API server for danbotlab (dev - port 8901)
server {
        listen 80;
        listen 443 ssl;
        server_name api.danbotlab.local api.danbotlab;
        ssl_certificate /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass http://127.0.0.1:8901;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
}

# API server for api.danbotlab.com (PRIMARY / canonical production API)
server {
        listen 80;
        listen 443 ssl;
        server_name api.danbotlab.com;
        ssl_certificate /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass http://127.0.0.1:8900;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
}

# Legacy api.danielmarkjones.com -> 301 to canonical api.danbotlab.com.
server {
        listen 80;
        listen 443 ssl;
        server_name api.danielmarkjones.com;
        ssl_certificate /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        return 301 https://api.danbotlab.com$request_uri;
}

# Static files for danbotlab
server {
        listen 80;
        listen 443 ssl;
        server_name localhost danbotlab.local danbotlab *.danbotlab.local *.danbotlab;
        ssl_certificate /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Never serve the backend dir (Go source, secrets, trivia answers) or
        # dotfiles (.git, etc). These live under the web root but must not be public.
        location ~ ^/backend(/|$) { deny all; return 404; }
        location ~ /\.           { deny all; return 404; }

        location / {
            root /home/danbot/dev/dmj_web/;
        }
}

# Static files for danbotlab.com (PRIMARY / canonical production domain)
server {
        listen 80;
        listen 443 ssl;
        server_name danbotlab.com www.danbotlab.com;
        ssl_certificate /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Never serve the backend dir (Go source, secrets, trivia answers) or
        # dotfiles (.git, etc). These live under the web root but must not be public.
        location ~ ^/backend(/|$) { deny all; return 404; }
        location ~ /\.           { deny all; return 404; }

        location / {
            root /opt/dmj_web/;
        }
}

# Legacy danielmarkjones.com -> 301 redirect to canonical danbotlab.com.
server {
        listen 80;
        listen 443 ssl;
        server_name danielmarkjones.com *.danielmarkjones.com;
        ssl_certificate /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        return 301 https://danbotlab.com$request_uri;
}