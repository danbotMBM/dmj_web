<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>daniel mark jones</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="gitlab_md.css">
    <link rel="stylesheet" href="mainStyle.css">
    <link rel="stylesheet" href="header.css">
</head>

<body>
    <div id="header_loc"></div>

    <main class="page">
        <figure class="hero-banner" id="jumbodiv">
            <img id="jumbo" alt="">
            <div class="hero-overlay"></div>
            <figcaption class="hero-caption" id="hero-caption"></figcaption>
        </figure>

        <article class="markdown-body" id="markdown_loc">
            <div class="skeleton skeleton-h1" aria-hidden="true"></div>
            <div class="feature-grid" aria-hidden="true">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
        </article>
    </main>

    <div id="image-viewer">
        <span id="close-btn">&times;</span>
        <img id="full-image" src="" alt="Full View" />
        <h3 id="full-image-caption"></h3>
    </div>

    <script src="photos.js"></script>
    <script>
        var jumbo = document.getElementById("jumbo");
        var photo = get_one_random_photo();
        jumbo.title = get_title(photo);
        // Progressive load: show low-res immediately, then swap in the
        // full-resolution image once it's ready. Always upgrades to /high/
        // regardless of connection speed.
        jumbo.src = "/photos/pics/low/" + photo.filename;
        var heroFull = new Image();
        heroFull.onload = function () { jumbo.src = heroFull.src; };
        heroFull.src = "/photos/pics/high/" + photo.filename;
        var caption = document.getElementById("hero-caption");
        if (caption && photo.location) {
            caption.textContent = photo.location;
        }
        // Wire up click-to-zoom once lazyload.js has defined set_up_zoomable.
        document.addEventListener("DOMContentLoaded", function () {
            if (typeof set_up_zoomable === "function") set_up_zoomable(jumbo);
        });
    </script>
    <script type="module">
        import { import_html, import_htmls } from "/utils.js";
        var paths = [
            "/index_md.html",
            "/games/trivia/feature_md.html",
            "/blogs/recall/feature_md.html",
            "/blogs/race_results/feature_md.html",
            "/blogs/running/feature_md.html",
            "/blogs/twinkle/feature_md.html",
            "/blogs/ddns/feature_md.html",
            "/blogs/webgpu/feature_md.html",
            "/photos/feature_md.html",
        ];
        import_html("/header.html", "header_loc");
        import_htmls(paths, "markdown_loc");
    </script>
    <script src="lazyload.js"></script>
</body>

</html>
